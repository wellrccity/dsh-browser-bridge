<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenCode Browser Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="hero">
    <div class="brand">
      <img class="logo" src="icons/icon48.png" alt="" width="40" height="40">
      <div>
        <h1>Browser Bridge</h1>
        <p class="subtitle">Human control of Chrome for OpenCode</p>
      </div>
    </div>
    <span id="statusPill" class="pill pill-off" role="status" aria-live="polite">Disconnected</span>
  </header>

  <main>
    <section class="card" aria-labelledby="connection-title">
      <div class="section-heading">
        <h2 id="connection-title">Connection</h2>
        <button id="refreshBtn" class="icon-button" type="button" title="Refresh status" aria-label="Refresh status">↻</button>
      </div>

      <dl class="status-grid">
        <div>
          <dt>Server</dt>
          <dd id="currentServer">—</dd>
        </div>
        <div>
          <dt>Extension</dt>
          <dd id="extensionVersion">—</dd>
        </div>
        <div>
          <dt>Active tab</dt>
          <dd id="activeTab">—</dd>
        </div>
        <div>
          <dt>Last contact</dt>
          <dd id="lastSeen">—</dd>
        </div>
      </dl>

      <form id="connectionForm" autocomplete="off">
        <label class="field">
          <span>MCP server URL</span>
          <input id="serverUrl" name="serverUrl" type="text" inputmode="url" spellcheck="false" placeholder="ws://127.0.0.1:8787">
        </label>
        <label class="field">
          <span>Token <em>(optional)</em></span>
          <input id="token" name="token" type="password" spellcheck="false" placeholder="Leave empty if not using token">
        </label>

        <div class="button-row">
          <button id="connectBtn" class="button primary" type="button">Connect</button>
          <button id="disconnectBtn" class="button" type="button">Disconnect</button>
          <button id="saveBtn" class="button accent" type="submit">Save</button>
        </div>
      </form>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    </section>

    <section class="card" aria-labelledby="behavior-title">
      <h2 id="behavior-title">Behavior</h2>

      <label class="toggle">
        <input id="autoConnect" type="checkbox">
        <span>
          <strong>Auto-connect</strong>
          <small>Reconnects when Chrome or the MCP service starts.</small>
        </span>
      </label>

      <label class="toggle">
        <input id="preferCdp" type="checkbox">
        <span>
          <strong>Use CDP by default</strong>
          <small>Trusted input, screenshots and evaluation. Shows the debug banner.</small>
        </span>
      </label>

      <label class="toggle">
        <input id="keepAttached" type="checkbox">
        <span>
          <strong>Keep debugger attached</strong>
          <small>Disable to detach a few seconds after each command.</small>
        </span>
      </label>

      <label class="toggle">
        <input id="interceptDialogs" type="checkbox">
        <span>
          <strong>Intercept dialogs</strong>
          <small>Answers alert/confirm/prompt so automation does not hang.</small>
        </span>
      </label>

      <label class="toggle sub-toggle">
        <input id="confirmDialogs" type="checkbox">
        <span>
          <strong>Accept <code>confirm()</code></strong>
          <small>When off, answers "Cancel".</small>
        </span>
      </label>

      <label class="field compact">
        <span>Response for <code>prompt()</code></span>
        <input id="promptDialogText" type="text" spellcheck="false" placeholder="Text returned by prompt">
      </label>

      <label class="toggle">
        <input id="autoSwitchNewTabs" type="checkbox">
        <span>
          <strong>Switch to new tabs</strong>
          <small>Automatically activates a tab opened by a click.</small>
        </span>
      </label>
    </section>

    <section class="card" aria-labelledby="diagnostics-title">
      <h2 id="diagnostics-title">Diagnostics</h2>
      <div class="diagnostics">
        <div class="diag-row">
          <span>Open tabs</span>
          <strong id="tabCount">0</strong>
        </div>
        <div class="diag-row">
          <span>Debugger attached</span>
          <strong id="debuggerTabs">None</strong>
        </div>
        <div class="diag-row">
          <span>Token configured</span>
          <strong id="hasToken">No</strong>
        </div>
      </div>
      <p id="lastError" class="error" hidden></p>
      <button id="detachBtn" class="button full" type="button">Detach debugger from all tabs</button>
    </section>
  </main>

  <footer>
    <span>Local and private · <code>127.0.0.1</code></span>
    <button id="extensionsBtn" class="link-button" type="button">chrome://extensions</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
